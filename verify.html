<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | SpendSense</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 10% 20%, #ffd6f6 0, transparent 30%),
                radial-gradient(circle at 90% 80%, #c8f7ff 0, transparent 30%),
                linear-gradient(135deg, #f7e9ff, #e8f7ff);
            padding: 20px;
        }

        .verify-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(100, 70, 150, 0.18);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #6c3db8;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        #userEmail {
            color: #6c3db8;
            font-weight: bold;
            word-break: break-word;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5d7f7;
            border-radius: 14px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #9b6de3;
            box-shadow: 0 0 0 4px rgba(155, 109, 227, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8e5de7, #d66de8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(142, 93, 231, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #7b52b9;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="verify-card">

        <div class="logo">💰</div>

        <h1>Verify Your Email ✨</h1>

        <p class="subtitle">
            We sent a 6-digit OTP to
            <br>
            <span id="userEmail"></span>
        </p>

        <form id="verifyForm">

            <input
                type="text"
                id="otp"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <button type="submit">
                Verify & Enter SpendSense 🚀
            </button>

        </form>

        <a href="login.html" class="back">
            ← Back to Login
        </a>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>

        const email = sessionStorage.getItem("loginEmail");

        if (!email) {
            window.location.href = "login.html";
        }

        document.getElementById("userEmail").textContent = email;

        document
            .getElementById("verifyForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const otp = document
                    .getElementById("otp")
                    .value
                    .trim();

                if (otp.length !== 6) {
                    alert("Please enter the 6-digit OTP.");
                    return;
                }

                const { data, error } =
                    await supabaseClient.auth.verifyOtp({
                        email: email,
                        token: otp,
                        type: "email"
                    });

                if (error) {
                    alert("Invalid or expired OTP. Please try again.");
                    console.error(error);
                    return;
                }

                if (data.session) {

                    sessionStorage.removeItem("loginEmail");

                    alert("Login successful! Welcome to SpendSense 💜");

                    window.location.href = "index.html";
                }

            });

    </script>

</body>
</html>
